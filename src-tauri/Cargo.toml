[package]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — assistente desktop"
authors = ["Guilherme Santana"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# O binário é um shim; a lógica mora na lib para poder ser testada e reusada.
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"
cpal = "0.17"
hound = "3.5"
xcap = "0.9"
image = "0.25"
base64 = "0.23"
async-trait = "0.1"
rodio = { version = "0.21", features = ["symphonia-mp3"] }
nokhwa = { version = "0.10", features = ["input-native"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
url = "2"
# Só para LER o broadcast dos aparelhos Tuya da rede, que vem cifrado em AES-128-ECB com
# uma chave pública fixa. Não é `tuya-rs` porque aquela crate exige rustc 1.88 e este
# projeto declara 1.77.2 — subir o piso do repo inteiro por uma crate 0.2.1 sairia mais
# caro que as ~40 linhas de decodificação em `core/casa.rs`.
aes = "0.8"
# O anúncio do protocolo 3.5 vem em AES-128-GCM, com a mesma chave pública do 3.3. Sem
# `getrandom`: aqui só se decifra, nunca se gera nonce.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# Assinatura das chamadas à nuvem da Tuya (HMAC-SHA256 em hex) e, depois, a negociação
# de sessão dos protocolos 3.4 e 3.5. Uma dupla, dois usos bem distantes.
hmac = "0.12"
sha2 = "0.10"
# Só o `sleep` do polling de serviço. Já vem no lock (reqwest, tauri) — declarar não
# acrescenta compilação, e evita que `core/` precise conhecer o runtime do Tauri.
tokio = { version = "1", features = ["time"] }

# Já vinha no Cargo.lock como dependência transitiva (cpal, nokhwa, tauri), então
# declarar não acrescenta compilação — só destrava as features que a gente usa.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }

[lints.clippy]
all = "deny"
