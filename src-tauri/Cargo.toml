[package]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — assistente desktop"
authors = ["Guilherme Santana"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# O binário é um shim; a lógica mora na lib para poder ser testada e reusada.
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` destrava `Window::add_child`, que é o que permite um NAVEGADOR de verdade
# dentro do app: um webview filho, mesmo motor do Edge, sem as restrições de `<iframe>`.
# Medido: Google, YouTube e DuckDuckGo respondem `X-Frame-Options: SAMEORIGIN` e ficariam
# em branco num iframe — e "abre o youtube" é o exemplo canônico do roteador.
#
# "Unstable" aqui quer dizer que a API pode mudar entre versões menores do Tauri, não que
# ela seja experimental em produção — é o mesmo webview que a janela principal usa.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
# O PRIMEIRO plugin do projeto, e a exceção é consciente: não existe jeito de abrir um
# seletor de arquivos NATIVO sem ele, e escolher o clipe da própria voz é exatamente isso.
# O `<input type="file">` do HTML abriria o mesmo diálogo, mas esconde o caminho por
# segurança — sobrariam os bytes atravessando o IPC para o Rust reencaminhar.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "2"
cpal = "0.17"
hound = "3.5"
xcap = "0.9"
image = "0.25"
base64 = "0.23"
async-trait = "0.1"
rodio = { version = "0.21", features = ["symphonia-mp3"] }
nokhwa = { version = "0.10", features = ["input-native"] }
# `query` monta a query string COM codificação: "Belo Horizonte" e "Teresópolis" só
# chegam certos no serviço por causa dela.
reqwest = { version = "0.13", features = ["json", "multipart", "query"] }
url = "2"
# Só para LER o broadcast dos aparelhos Tuya da rede, que vem cifrado em AES-128-ECB com
# uma chave pública fixa. Não é `tuya-rs` porque aquela crate exige rustc 1.88 e este
# projeto declara 1.77.2 — subir o piso do repo inteiro por uma crate 0.2.1 sairia mais
# caro que as ~40 linhas de decodificação em `core/casa.rs`.
aes = "0.8"
# O anúncio do protocolo 3.5 vem em AES-128-GCM, com a mesma chave pública do 3.3. Sem
# `getrandom`: aqui só se decifra, nunca se gera nonce.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# Assinatura das chamadas à nuvem da Tuya (HMAC-SHA256 em hex) e, depois, a negociação
# de sessão dos protocolos 3.4 e 3.5. Uma dupla, dois usos bem distantes.
hmac = "0.12"
sha2 = "0.10"
# Só o `sleep` do polling de serviço. Já vem no lock (reqwest, tauri) — declarar não
# acrescenta compilação, e evita que `core/` precise conhecer o runtime do Tauri.
# O `sync` entrou com a fala em fluxo: o canal que leva as frases do agente até o motor de
# voz é um `mpsc` do tokio, e ele precisa de um lado async dos dois — o produtor está
# dentro do `handle`, o consumidor sintetiza por HTTP.
tokio = { version = "1", features = ["time", "sync"] }
# **Reconhecimento facial**, para o Jarvis saber QUEM está na frente da webcam.
#
# O modelo de visão que ele já usa não serve para isto: um VLM descreve a cena ("um homem
# de camiseta escura") mas não carrega identidades, e responde "é a mesma pessoa?" com
# confiança e sem consistência — o modo de falha caro seria chamar você pelo nome errado.
# Reconhecer rosto é outra técnica: detectar, recortar alinhado, e transformar num vetor
# de 128 números que se compara por distância. É o que o Windows Hello faz.
#
# **Versões pregadas com `=`, e o motivo é o mesmo da `tuya-rs` logo acima.** O `ort` a
# partir do rc.10 exige rustc 1.81, e do rc.13 exige 1.88; o rc.9 pede 1.70 e cabe no
# 1.77.2 que este projeto declara. O `ort-sys` precisa do pino JUNTO: sem ele o Cargo
# resolve o rc.13 mesmo com o `ort` preso no rc.9, e o build script daquela versão não
# compila com o `ureq` atual (`tls_config` não existe mais) — o erro sai em `ort-sys`, que
# é o último lugar onde alguém procuraria.
ort = { version = "=2.0.0-rc.9", features = ["download-binaries"] }
ort-sys = "=2.0.0-rc.9"
# **Ler a página do resultado da busca**, e não só o trecho de 150 caracteres que a API do
# Google devolve. Para isso é preciso um parser de tag soup de verdade: o `limpar()` do
# `core/search.rs` foi escrito para tirar `<b>` de um snippet, e num documento inteiro ele
# cospe o conteúdo de todo `<script>` como se fosse texto.
#
# **Já está no `Cargo.lock`** (chega por `tauri-utils`/`wry`), então não há download nem
# risco de resolução. Mas, ao contrário do `tokio` e do `windows` aqui em cima, declarar
# NÃO é de graça: hoje ele compila só para o host, como proc-macro; declarado, passa a
# compilar também para o target, junto de `html5ever`, `markup5ever`, `tendril`,
# `selectors` e `cssparser`. São alguns segundos de build a mais, uma vez.
#
# MSRV conferido manifesto a manifesto: 1.75 aqui, 1.71 na família html5ever, 1.68 no
# cssparser, e o `selectors 0.36.1` não declara nenhum. Todos cabem no 1.77.2 que este
# pacote declara, sem precisar do pino que a `ort` precisou.
#
# **O que NÃO deu para conferir, e não é culpa destas duas crates:** `cargo +1.77.2 check`
# nem chega a compilar este projeto hoje. Ele para antes, em `aligned v0.4.3` — uma
# transitiva que já estava no `Cargo.lock` desde bem antes disto — com "feature
# `edition2024` is required". Ou seja, o `rust-version` acima já não descrevia a realidade
# quando este comentário foi escrito. Vale como intenção e como piso para escolher crate
# nova (foi por ele que a `tuya-rs` e o `ort` rc.13 ficaram de fora), não como algo que
# alguém consiga verificar rodando.
dom_query = "0.27"
# `join_all`, para as páginas serem lidas ao mesmo tempo em vez de uma atrás da outra — a
# busca passa a custar a mais lenta, e não a soma. Já vem no lock pelo `reqwest`.
#
# Não é o `JoinSet` do tokio: aquele exigiria a feature `rt` (que só as `dev-dependencies`
# ligam) e futuros `'static`, o que obrigaria a clonar o cliente e as URLs. O `join_all`
# roda na mesma task, sem `spawn`.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Só para as ferramentas `#[ignore]` que conversam com a nuvem: elas precisam de um
# executor, e o do Tauri não existe dentro de um teste.
tokio = { version = "1", features = ["rt", "macros"] }

# Já vinha no Cargo.lock como dependência transitiva (cpal, nokhwa, tauri), então
# declarar não acrescenta compilação — só destrava as features que a gente usa.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Dxgi",
    # WinRT, e nao Win32: a geolocalizacao moderna do Windows so existe aqui. E a
    # mesma API que o app de Mapas usa, e respeita a permissao de Privacidade.
    "Devices_Geolocation",
] }

[lints.clippy]
all = "deny"

# **Sem isto, a prévia da webcam roda a meio quadro por segundo em `tauri dev`.**
#
# Reduzir um quadro 1080p custa 32 ms com o `image` otimizado e **1826 ms** sem — 57×,
# medido no `bench_filtros` de `core/automation`. O mesmo vale para decodificar MJPEG e
# para o JPEG de saída, que passam pelas mesmas crates.
#
# Só as DEPENDÊNCIAS são otimizadas; o código do projeto continua sem otimização, então
# `panic` ainda aponta a linha certa e o depurador continua útil. Custa alguns minutos na
# primeira compilação e nada nas seguintes, porque elas não mudam.
# Código genérico de dependência (o codificador de JPEG é o caso) é gerado DENTRO do
# nosso crate, então ele herda as opções daqui — foi o que manteve o JPEG em 51 ms mesmo
# com as dependências já otimizadas. O nível 1 resolve isso e ainda mantém `panic` com a
# linha certa e o depurador utilizável; o 2 e o 3 é que começam a embaralhar o passo a
# passo.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# As checagens de estouro custam caro em código que percorre pixel a pixel, e o que elas
# protegem aqui é código de terceiros já testado — não o nosso, que continua com elas.
debug-assertions = false
overflow-checks = false
